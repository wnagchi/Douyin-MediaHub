name: Deploy Douyin-MediaHub (Windows)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-douyin-mediahub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy via git, build, restart (robust)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoDir = "C:\code\Douyin-MediaHub"
          $branch  = "main"
          $service = "DouyinMediaHub"
          $port    = 3000

          if (!(Test-Path $repoDir)) { throw "Repo dir not found: $repoDir" }
          if (!(Test-Path (Join-Path $repoDir ".git"))) { throw "Not a git repo: $repoDir" }

          Set-Location $repoDir

          function Get-DepFingerprint {
            param(
              [string]$TargetRepoDir
            )
            $pkgPath = Join-Path $TargetRepoDir "package.json"
            $lockPath = Join-Path $TargetRepoDir "package-lock.json"
            $pkgHash = if (Test-Path $pkgPath) { (Get-FileHash $pkgPath -Algorithm SHA256).Hash } else { "" }
            $lockHash = if (Test-Path $lockPath) { (Get-FileHash $lockPath -Algorithm SHA256).Hash } else { "" }
            return "$pkgHash|$lockHash"
          }

          $depBefore = Get-DepFingerprint -TargetRepoDir $repoDir

          Write-Host "Node version:"; node -v
          Write-Host "NPM version:";  npm -v

          # Git safe.directory for SYSTEM runner
          git config --global --add safe.directory C:/code/Douyin-MediaHub

          git fetch --all --prune
          git checkout $branch
          git reset --hard "origin/$branch"
          git clean -fd

          $depAfter = Get-DepFingerprint -TargetRepoDir $repoDir
          $needInstall = $false
          if ($depBefore -ne $depAfter) { $needInstall = $true }
          if (!(Test-Path (Join-Path $repoDir "node_modules"))) { $needInstall = $true }

          if ($needInstall) {
            Write-Host "Dependencies changed (or missing), running npm ci ..."
            npm ci
          } else {
            Write-Host "Dependencies unchanged, skip npm ci."
          }

          npm run build

          Write-Host "Stopping service $service ..."
          try {
            Stop-Service -Name $service -Force -ErrorAction Stop
          } catch {
            Write-Host "Stop-Service failed, will try to kill process on port $port"
          }

          for ($i=0; $i -lt 20; $i++) {
            $conn = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if (-not $conn) { break }
            Start-Sleep -Seconds 1
          }

          $conn = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
          if ($conn) {
            $pid = $conn.OwningProcess
            Write-Host "Killing PID $pid listening on port $port ..."
            taskkill /PID $pid /F | Out-Null
          }

          Write-Host "Starting service $service ..."
          Start-Service -Name $service

          Write-Host "Deploy completed successfully."
