name: Deploy Douyin-MediaHub (Windows)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-douyin-mediahub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy via git, build, restart
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $repoDir = "C:\code\Douyin-MediaHub"
          $branch  = "main"

          if (!(Test-Path $repoDir)) { throw "Repo dir not found: $repoDir" }
          if (!(Test-Path (Join-Path $repoDir ".git"))) { throw "Not a git repo: $repoDir" }

          Set-Location $repoDir

          Write-Host "Node version:"
          node -v
          Write-Host "NPM version:"
          npm -v

          git fetch --all --prune
          git checkout $branch
          git reset --hard "origin/$branch"
          git clean -fd

          npm ci
          npm run build

          Restart-Service -Name "DouyinMediaHub" -Force

          Write-Host "Deploy completed."
